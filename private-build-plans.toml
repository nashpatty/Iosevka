[buildPlans.iosevka]
family = "Iosevka"
spacing = "fixed"
serifs = "sans"
no-cv-ss = true

  [buildPlans.iosevka.variants]
  inherits = "ss20"

    [buildPlans.iosevka.variants.design]
    g = "double-storey"
    l = "zshaped"
    zero = "slashed-split"
    four = "closed"
    five = "oblique-upper-left-bar"
    six = "open-contour"
    seven = "curly-serifless"
    eight = "crossing"
    nine = "closed-contour"
    asterisk = "penta-low"
    number-sign = "slanted"
    ampersand = "upper-open"
    at = "fourfold-solid-inner"
    caret = "high"
    dollar = "open"
    cent = "open"
    question = "corner"
    punctuation-dot = "square"

    [buildPlans.iosevka.variants.italic]
    f = "flat-hook-tailed"
    g = "single-storey-serifless"
    j = "serifed"
    l = "tailed-serifed"
    t = "standard"

[buildPlans.iosevka.weights.regular]
shape = 400
menu = 400
css = 400

[buildPlans.iosevka.weights.medium]
shape = 500
menu = 500
css = 500

[buildPlans.iosevka.weights.bold]
shape = 700
menu = 700
css = 700

[buildPlans.iosevka.widths.normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.iosevka.slopes.upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.iosevka.slopes.italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
